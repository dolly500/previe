<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Website</title>

  <!-- SEO -->
  <meta
    name="description"
    content="Welcome to my website. This is my awesome website."
  />

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website" />

  <meta
  property="og:image"
  content="./images/cart.png"
/>

<meta
  property="og:image"
  content="https://nudeleaks.vercel.app/images/cart.png"
/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .hero-content {
      max-width: 700px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #666;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 24px;
      background: #000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to My Website</h1>

      <p>
        This is my awesome website with a social media preview.
      </p>

      <a href="#" class="button">
        Get Started
      </a>
    </div>
  </section>

</body>
</html>
